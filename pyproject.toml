[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dorothy-brew"
version = "0.1.0"
description = "Bitget 선물 자동매매 봇 — 백테스트 · 페이퍼 · 실전"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
exchange = ["ccxt>=4.2.0", "PyYAML>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "PyYAML>=6.0"]

[project.scripts]
dorothy = "dorothy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
