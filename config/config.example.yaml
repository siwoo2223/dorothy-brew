# dorothy-brew 설정 예시
# 복사해서 쓰세요:  cp config/config.example.yaml config/config.yaml
#
# ⚠ API 키는 여기 적지 마세요. 환경변수(.env)로만 넣습니다.

mode: paper                       # backtest | paper | live
initial_equity: 1000.0            # 백테스트/페이퍼 시작 자본 (USDT)
poll_interval_sec: 15             # 실시간 루프 주기(초)
db_path: data/dorothy.db
kill_switch_file: KILL            # 이 파일을 만들면 봇이 포지션을 정리하고 멈춘다

exchange:
  name: bitget
  symbol: "BTC/USDT:USDT"         # ccxt 무기한선물 표기법
  timeframe: "5m"                 # 1m 3m 5m 15m 30m 1h 2h 4h 1d
  # 레버리지는 수익을 키우는 손잡이가 아닙니다. 상한선일 뿐입니다.
  # 아래 risk 블록의 주석을 반드시 읽으세요 — 실제 손잡이는 risk_per_trade입니다.
  # 여기서 배율을 올리면 바뀌는 것은 청산가와 증거금 효율이지 손익이 아닙니다.
  leverage: 2.0
  margin_mode: isolated           # isolated 권장 (한 종목 사고가 계좌 전체로 번지지 않음)
  taker_fee: 0.0006               # 실제 등급별 수수료로 맞추세요. 백테스트 신뢰도가 여기 달렸습니다
  maker_fee: 0.0002
  slippage: 0.0005                # 시장가 체결 밀림 가정치. 넉넉히 잡는 편이 안전합니다

# ─────────────────────────────────────────────────────────────────────────
# 주문 수량이 정해지는 방식 — 복리와 레버리지가 각각 어디에 붙는가
#
# src/dorothy/risk/manager.py 의 evaluate_entry()가 매번 이렇게 계산합니다:
#
#     risk_amount   = equity * risk_per_trade          # 이번에 잃어도 되는 금액
#     size          = risk_amount / stop_distance      # 손절까지의 거리로 나눈다
#     max_notional  = equity * max_position_pct * min(leverage, max_leverage)
#     size          = min(size, max_notional / price, equity * lev / price)
#
# 아래 숫자는 config/donchian12.example.yaml 설정으로 8.6년 실데이터(BTC
# 12시간봉)를 돌려 잰 것입니다. 전략이 달라도 구조는 같습니다.
#
# 1) 복리는 자동입니다.
#    equity는 매 진입 시점에 다시 읽습니다. 자본이 불어나면 다음 주문이
#    그만큼 커지고 깨지면 작아집니다. 따로 켜고 끌 설정이 없습니다.
#
# 2) 레버리지는 손익을 바꾸지 않습니다. 천장일 뿐입니다.
#    1회 리스크를 1%로 고정하고 배율만 바꾸면:
#
#        1x  142건  +34.19%  MDD 5.9%   ← 142건 중 17건이 천장에 깎임
#        2x  142건  +37.31%  MDD 5.9%
#        5x  142건  +37.31%  MDD 5.9%   ← 같음
#       20x  142건  +37.31%  MDD 5.9%   ← 같음
#
#    2배에서 이미 천장이 리스크 기준 수량보다 높으므로 그 위로는 아무것도
#    안 바뀝니다. 1x만 낮은 것은 수익이 아니라 수량이 깎여서입니다.
#    배율을 올려서 실제로 달라지는 건 청산가와 증거금 효율뿐입니다.
#
# 3) 실제 손잡이는 risk_per_trade입니다. 다만 max_position_pct가
#    두 번째 천장으로 같이 물립니다. (배율 2배 고정, 이 파일 기본값 0.30)
#
#       0.5%  142건   +17.13%  MDD  2.6%   천장에 깎인 진입   0/142
#       1.0%  142건   +37.31%  MDD  5.9%   천장에 깎인 진입   0/142
#       2.0%  142건   +79.20%  MDD 11.7%   천장에 깎인 진입  17/142
#       4.0%  142건   +93.96%  MDD 19.4%   천장에 깎인 진입 111/142
#
#    매매 건수는 넷 다 똑같습니다. 신호는 그대로고 크기만 변합니다.
#    2% 위로 수익이 눕는 것은 전략의 한계가 아니라 명목가 상한 때문입니다.
#    상한을 풀면(max_position_pct 50) 2.0% → +86.54%, 4.0% → +223.30%가
#    됩니다. 리스크를 올리려면 이 값도 같이 봐야 한다는 뜻입니다.
#
# 4) 복리는 양날입니다. 키운다고 계속 늘지 않습니다.
#    상한과 차단을 모두 풀고 리스크만 계속 올리면 (시작 자본 200):
#
#        1%      275   MDD  5.9%
#        8%    1,520   MDD 41.0%
#       16%    3,328   MDD 73.0%   ← 최대
#       25%    1,871   MDD 92.1%
#       40%       19   MDD 99.6%   ← 1회 기대값이 +인데도 원금의 1/10
#
#    변동성 손실(volatility drag) 때문입니다. -50% 뒤의 +50%는 본전이
#    아니라 -25%입니다. 켈리 최적점을 넘기면 기대값이 양수여도 파산합니다.
#    최적점의 절반 이하로 쓰는 것이 통례입니다 — 위 곡선에서 8% 이하,
#    실전에서는 MDD를 견딜 수 있는 1~2%를 권합니다.
# ─────────────────────────────────────────────────────────────────────────
risk:
  risk_per_trade: 0.01            # 노출을 조절하는 진짜 손잡이. 1% 권장, 2% 초과 비권장
  max_position_pct: 0.30          # 명목가 상한 (자본 대비)
  # ⚠ 아래 두 한도는 '하루' 단위로 초기화됩니다. 저빈도 전략(예: 12시간봉
  #    돈치안은 평균 22일에 한 번 매매)에서는 같은 날 두 번 걸릴 일이 없어
  #    사실상 발동하지 않습니다. 계측해보니 1회 리스크를 12%로 올려도
  #    차단이 한 번도 안 걸렸습니다. 저빈도라면 max_drawdown_pct를 쓰세요.
  max_daily_loss_pct: 0.03        # 하루 3% 잃으면 당일 매매 중단
  max_consecutive_losses: 4       # 4연패 시 당일 중단 (다음 날 자동 재개)
  # 고점 대비 낙폭 한도. 날짜로 초기화되지 않고 봇을 재시작해도 저널에서
  # 복원되므로, 매매가 드문 전략에서 유일하게 실제로 작동하는 보호입니다.
  # max_drawdown_pct: 0.20
  max_open_positions: 1
  max_leverage: 3.0               # exchange.leverage가 이보다 크면 여기로 깎임

strategy:
  name: ema_cross                 # 샘플 전략. 자기 전략으로 교체하는 것이 전제입니다
  params:
    fast: 20
    slow: 50
    atr_period: 14
    atr_stop_mult: 2.0            # 손절 = 진입가 ∓ ATR × 2
    atr_target_mult: 3.0          # 익절 = 진입가 ± ATR × 3
    allow_short: true

notify:
  telegram_enabled: false         # true로 하려면 .env에 토큰/챗ID 필요
