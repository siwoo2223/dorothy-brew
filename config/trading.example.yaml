# 직접 매매용 설정 — "적당한 배율로 트레이딩"
#
# ⚠ 먼저 알아야 할 것: 이 저장소는 우위가 있는 신호를 찾지 못했습니다.
#   설정 202개를 훑어 겹침을 뺀 |t|>=2를 넘긴 것이 0개입니다(README).
#   그러니 이 파일은 **"뭘 사고 팔지"를 정해주지 않습니다.** 판단은
#   본인이 하고, 이 파일은 **한 번의 실수로 계좌가 끝나지 않게** 합니다.
#
#   기대값이 0인 게임에서 결과를 정하는 것은 신호가 아니라 크기와 한도입니다.
#
# ⚠ API 키는 여기 적지 마세요. 환경변수(.env)로만 넣습니다.

mode: paper                       # 실전 전에 반드시 paper로 먼저
initial_equity: 200.0
poll_interval_sec: 15
db_path: data/dorothy.db
kill_switch_file: KILL            # 이 파일을 만들면 포지션을 정리하고 멈춘다

exchange:
  name: bitget
  symbol: "BTC/USDT:USDT"
  timeframe: "4h"
  # 배율은 수량을 정하지 않습니다(그건 risk_per_trade가 합니다).
  # 배율이 정하는 것은 **청산가**입니다. 청산까지 거리 ≈ 1/배율 - 0.005
  #
  #   3배 → 32.8%   5배 → 19.5%   10배 → 9.5%   20배 → 4.5%
  #
  # 손절 = ATR × 2.0 기준, BTC 8.6년 실측 손절폭과 겹쳐본 안전 상한:
  #
  #   타임프레임   손절폭 중앙값   상위 1%    안전 상한
  #      1시간        1.42%      5.59%      8.6배
  #      4시간        3.07%     10.92%      4.5배   ← 이 설정
  #     12시간        5.68%     19.31%      2.6배
  #
  # (안전 상한 = 상위 1% 손절폭에도 청산이 손절보다 두 배 먼 배율)
  # 4.5배가 상한이므로 여유를 두고 3배로 둡니다. 직접 확인:
  #   PYTHONPATH=src python3 -m dorothy.cli liqcheck \
  #       --config config/trading.yaml --csv data/btc_4h.csv
  leverage: 3.0
  margin_mode: isolated           # 한 종목 사고가 계좌 전체로 번지지 않게
  taker_fee: 0.0006               # 본인 등급으로 맞추세요
  maker_fee: 0.0002
  slippage: 0.0005

risk:
  # 여기가 실제 손잡이입니다. 8.6년 실측: 이 값만 바꿔도
  # 0.5% → +17.13%, 1% → +37.31%, 2% → +86.54% (같은 신호, 같은 건수)
  # 켈리 최적점을 넘기면 기대값이 양수여도 파산합니다. 1~2%를 권합니다.
  risk_per_trade: 0.01
  max_position_pct: 0.30

  # **저빈도로 매매한다면 이것이 유일하게 작동하는 보호입니다.**
  # 아래 일일 한도들은 하루 단위로 초기화돼서, 며칠에 한 번 매매하면
  # 같은 날 두 번 걸릴 일이 없습니다. 이건 날짜와 무관하고
  # 봇을 재시작해도 저널에서 고점이 복원됩니다.
  max_drawdown_pct: 0.20

  max_daily_loss_pct: 0.03        # 하루에 여러 번 매매할 때만 의미가 있습니다
  max_consecutive_losses: 4
  max_open_positions: 1
  max_leverage: 3.0               # exchange.leverage가 커도 여기서 깎입니다

strategy:
  # 검증을 통과한 신호가 없으므로 기본값을 넣지 않습니다.
  # 직접 매매하실 거면 봇의 전략은 끄고 안전장치만 쓰거나,
  # 본인 규칙을 전략으로 옮겨 백테스트부터 하세요.
  name: donchian
  params:
    channel: 40
    allow_short: false
    # 손절 배수를 왜 2.0으로 두는가 — 산수 쪽 근거입니다.
    #
    #   수량 = 리스크 ÷ 손절폭이라, 손절을 좁히면 **수량이 커집니다.**
    #   4시간봉 중앙값에서 (자본 10,000, 1회 리스크 1%):
    #
    #     ATR×1.5  손절폭 2.30%  →  명목가 4,348  왕복 수수료 9.57
    #     ATR×2.0  손절폭 3.07%  →  명목가 3,257  왕복 수수료 7.17
    #
    #   명목가가 33% 크면 수수료도 33% 큽니다. 움직임은 작아지는데
    #   비용은 커집니다. 손절을 좁혀 얻는 배율 여유는 어차피 쓸 일이
    #   없습니다 — 배율은 천장일 뿐 수량을 늘리지 않으니까요.
    #   이건 백테스트 결과가 아니라 사이징 식에서 바로 나오는 산수입니다.
    #
    # ⚠ 익절 배수(R:R)는 **이 데이터로 정할 수 없습니다.** 겹침을 빼고
    #   재보니 R:R 1.0~3.0 전부 t < 1.6으로 0과 구별되지 않습니다
    #   (4시간봉 겹침제거 표본 459~1,211건). 아래 4.0은 R:R 2.0이라는
    #   무난한 선택일 뿐 검증된 값이 아닙니다. 다만 R:R 1.0은 피하세요 —
    #   유일하게 뚜렷하게 나쁜 쪽이었습니다.
    atr_stop_mult: 2.0            # liqcheck의 손절폭 분포가 이 값에서 나옵니다
    atr_target_mult: 4.0          # R:R 2.0 (검증된 값이 아닙니다 — 위 경고)

notify:
  telegram_enabled: false
