# ICT 유동성 + 피보나치 OTE + 각도(변위) + 엘리엇 소프트 필터
#
# 사용:  cp config/ict_confluence.example.yaml config/config.yaml
#
# ⚠ 아래 숫자는 '출발점'이지 검증된 값이 아닙니다.
#   실제 데이터로 dorothy diagnose → dorothy ablate 를 돌려 직접 맞추세요.

mode: paper
initial_equity: 1000.0
poll_interval_sec: 15
db_path: data/dorothy.db
kill_switch_file: KILL

exchange:
  name: bitget
  symbol: "BTC/USDT:USDT"
  timeframe: "15m"          # ICT 구조는 1분봉에서 노이즈가 심합니다. 15m~1h 권장
  leverage: 2.0
  margin_mode: isolated
  taker_fee: 0.0006
  maker_fee: 0.0002
  slippage: 0.0005

risk:
  risk_per_trade: 0.01
  max_position_pct: 0.30
  max_daily_loss_pct: 0.03
  max_consecutive_losses: 4
  max_open_positions: 1
  max_leverage: 3.0

strategy:
  name: ict_confluence
  params:
    # ── 스윙 검출 ─────────────────────────────────────────
    swing_left: 2
    swing_right: 2            # 클수록 노이즈↓ 반응↓. 확정 지연이 곧 이 값입니다
    swing_min_atr: 0.5        # 잔파동 제거 (직전 스윙 대비 최소 진폭, ATR 배수)
    atr_period: 14

    # ── 유동성 (ICT) ──────────────────────────────────────
    pool_tolerance: 0.15      # 등가 고점/저점(EQH/EQL)으로 묶는 허용오차
    pool_max_age: 150         # 이보다 묵은 레벨은 무시
    pool_max_distance: 6.0    # 현재가에서 이보다 먼 풀은 무시 (ATR 배수)
    sweep_lookback: 30        # 스윕 후 몇 봉까지 셋업을 유효로 볼지
    sweep_min_penetration: 0.15   # 최소 침투 깊이 (ATR 배수)
    min_displacement_bars: 2  # 스윕 후 변위가 만들어질 최소 시간
    session_lookback: 0       # >0이면 직전 구간 고저(PDH/PDL 대용)를 풀에 추가
                              # 15분봉에서 하루 = 96

    # ── 각도 (변위) ───────────────────────────────────────
    # ATR 정규화 각도입니다. 45도 = 1봉당 1 ATR.
    # 차트에서 눈으로 보는 각도가 아니라 종목·타임프레임 무관한 값입니다.
    min_displacement_angle: 30.0
    min_r_squared: 0.0        # 0.5~0.7로 올리면 '깔끔한 추세'만 받습니다

    # ── 진입 구간 (피보나치) ──────────────────────────────
    entry_tolerance: 0.25     # 고점/저점·레벨 허용오차 (말씀하신 '슬리피지')
    use_fvg: true             # FVG(갭)도 진입 구간으로 인정

    # ── 손절 / 목표 ───────────────────────────────────────
    stop_buffer_atr: 0.5      # 스윕 극단 바깥으로 더 뺄 거리 → 재털림 방지
    min_rr: 1.5               # 최소 손익비. 실측상 가장 강력한 게이트입니다
    target_extension: 1.618   # 반대편 유동성 풀이 없을 때의 대체 목표

    # ── 합류 점수 ─────────────────────────────────────────
    min_score: 3.0
    analysis_window: 400      # 매 판단에 쓰는 최근 봉 수 (실전 fetch 개수와 맞추세요)

    # ── 엘리엇 (감점 전용) ────────────────────────────────
    # 카운트가 봉의 약 20%에서 바뀌므로 하드 필터로 쓰지 않습니다.
    # 'N파다'로 진입하지 않고, 5파 말미/방향 불일치일 때만 감점합니다.
    elliott_enabled: true
    elliott_penalty: 1.0

    # ── 청산 ──────────────────────────────────────────────
    exit_on_opposite_choch: true
    allow_short: true

notify:
  telegram_enabled: false
