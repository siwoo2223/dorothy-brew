# ⚠ 기각했습니다. 원래 이 파일은 "이 저장소에서 |t| >= 2를 넘긴 유일한 설정"
#   이었습니다. 그 t값이 틀렸습니다.
#
# 무엇이 틀렸나
#   돌파 신호는 서로 겹칩니다. 40봉 고가를 뚫으면 다음 몇 봉도 대개 뚫려
#   있습니다. 신호마다 '앞으로 60봉'의 결과를 붙여 t를 내면 같은 가격
#   움직임을 여러 번 세게 됩니다. 표본만 늘고 정보량은 그대로라 t가
#   √(겹친배수)만큼 부풀려집니다.
#
#   그리고 봇은 한 번에 포지션 하나만 듭니다. 보유 중에 들어온 신호는
#   애초에 잡을 수 없습니다. 잡을 수 없는 것을 실적에 넣으면 안 됩니다.
#
#     겹침 포함   291건   1회 +1.1975%   t = 2.67   ✓   ← 발표했던 숫자
#     겹침 제거   115건   1회 +0.7335%   t = 0.99   ✗   ← 실제로 잡히는 것
#
#     보유 중이라 잡을 수 없었던 신호 176건 (60%)
#
# 다시 재니 근거가 전부 무너집니다
#   채널      7개 중 0개 통과 (t가 -0.08 ~ 1.35에 흩어짐, 단조성 없음)
#   타임프레임 6개 중 2개 (8h는 t=2.03 경계선, 3d는 23건)
#   방향      롱 전용 t=0.99 / 롱숏 t=0.57 — 둘 다 탈락
#   기간      전반 t=0.94 / 후반 t=0.36 — 약해진 게 아니라 처음부터 없음
#
#   리스크 사이징을 걸고 실제 체결만 세면 142건, 1건당 +0.876%, t=1.55.
#   1건당 우위의 95% 신뢰구간이 [-0.235%, +1.987%]로 0을 포함합니다.
#
# 직접 확인
#   PYTHONPATH=src python3 -m dorothy.cli edge \
#       --config config/donchian12.rejected.yaml --csv data/btc_12h.csv --max-bars 60
#
# 이 파일은 지우지 않고 남겨둡니다. 무엇을 어떻게 잘못 쟀는지가
# 설정값 자체보다 쓸모 있습니다. config/ema_long.rejected.yaml과 같은 이유입니다.
#
# ⚠ API 키는 여기 적지 마세요. 환경변수(.env)로만 넣습니다.

mode: backtest
initial_equity: 200.0
exchange:
  name: bitget
  symbol: "BTC/USDT:USDT"
  timeframe: "12h"
  # 이 값을 올려도 손익은 안 바뀝니다. 아래 risk 주석을 보세요.
  leverage: 2.0
  taker_fee: 0.0006
  maker_fee: 0.0002
  slippage: 0.0005
risk:
  # 이 설정의 성적(+37.31%, MDD 5.9%)은 '1회 리스크 1%' 기준입니다.
  # 수량은 매 진입마다 risk_per_trade × 현재 자본 ÷ 손절까지의 거리로
  # 다시 계산됩니다. 자본을 매번 새로 읽으므로 복리는 자동으로 걸립니다.
  #
  # 레버리지가 아니라 이 값이 결과를 정합니다. 같은 8.6년 데이터에서:
  #
  #   배율만 바꾸면 (리스크 1%)        리스크만 바꾸면 (배율 2배)
  #      1x  +34.19%  MDD  5.9%          0.5%  +17.13%  MDD  2.6%
  #      2x  +37.31%  MDD  5.9%          1.0%  +37.31%  MDD  5.9%
  #      5x  +37.31%  MDD  5.9% ← 같음   2.0%  +79.20%  MDD 11.7%
  #     20x  +37.31%  MDD  5.9% ← 같음   4.0%  +93.96%  MDD 19.4%
  #
  # 매매는 어느 쪽이든 142건입니다. 신호는 그대로고 크기만 변합니다.
  # 배율을 올려서 달라지는 건 청산가와 증거금 효율뿐입니다.
  # (1x가 낮은 것도 수익이 아니라 명목가 상한에 142건 중 17건이 깎여서입니다.)
  #
  # 오른쪽 표가 2% 위로 눕는 것도 전략의 한계가 아니라 명목가 상한입니다.
  # 아래 max_position_pct 기본값 0.30에 4%에서는 142건 중 111건이 깎입니다.
  # 상한을 풀면 2.0% → +86.54%, 4.0% → +223.30%가 됩니다.
  #
  # ⚠ 그렇다고 리스크를 계속 올리면 안 됩니다. 상한과 차단을 모두 풀고
  #    시작 자본 200으로 재보면 8% → 1,520, 16% → 3,328(최대, MDD 73%),
  #    25% → 1,871, 40% → 19로 되돌아옵니다. 1회 기대값은 40%에서도
  #    여전히 양수인데 원금의 1/10이 됩니다. 변동성 손실 때문입니다.
  #    켈리 최적점의 절반 이하 — 여기서는 1~2%가 적정입니다.
  risk_per_trade: 0.01
  # 고점 대비 낙폭 한도. **저빈도 전략에는 이게 유일하게 작동하는 보호입니다.**
  # 아래 일일 손실 한도와 연속 손실 한도는 둘 다 '하루' 단위로 초기화되는데,
  # 이 전략은 평균 22일에 한 번 매매해서 같은 날 두 번 걸릴 일이 없습니다.
  # 계측해보니 1회 리스크를 12%로 올려도 차단이 한 번도 발동하지 않았습니다.
  max_drawdown_pct: 0.20
  max_daily_loss_pct: 0.03
  max_consecutive_losses: 4
  max_open_positions: 1
strategy:
  name: donchian
  params:
    channel: 40
    allow_short: false
