# ⚠ 이 설정은 추천이 아닙니다. 왜 추천이 아닌지의 기록입니다.
#
# 2021~2026 5년 창에서는 좋아 보였습니다:
#     100거래 · +18.43% · MDD 6.1% · 수익/MDD 3.03 (매수 후 보유는 0.89)
#
# 데이터를 2018년까지 늘리자 뒤집혔습니다:
#     172거래 · +13.89% · MDD 10.6% · 수익/MDD 1.31 (매수 후 보유는 5.98)
#
# 8.6년간 연 1.5%입니다. 같은 기간 그냥 들고 있었으면 +486%였습니다.
#
# 결정적인 것은 2018년입니다. 5년 창에는 폭락장이 2022년 하나뿐이었고
# 거기서 +10.37%가 나와 "하락장에서도 버틴다"고 판단했습니다.
# 2018년(BTC -72.2%)을 넣으니 -4.11%였습니다. n=1은 근거가 아니었습니다.
#
# 파라미터 고원 검사(25개 중 22개 흑자)와 연도별 검사를 통과하고도 틀렸습니다.
# 두 검사 모두 같은 5년 창 안에서 돌았기 때문입니다.
#
# 타임프레임도 봉우리였습니다. 같은 규칙이 1h -53.20%, 2h -19.31%,
# 4h +18.43%, 6h +14.26%, 12h +9.53%, 1d -3.49%입니다.
# 6개 중 3개가 마이너스이고 흑자 구간의 꼭대기가 정확히 4h인데, 그 4h를
# 제가 골랐습니다. fast/slow만 파라미터가 아니라 타임프레임도 파라미터입니다.
#
# 남겨두는 이유: 이 설정을 다시 시도하려는 사람이 같은 길을 반복하지 않도록.
# 실전에 쓰지 마세요.
#
# ⚠ API 키는 여기 적지 마세요. 환경변수(.env)로만 넣습니다.

mode: backtest
initial_equity: 200.0
exchange:
  name: bitget
  symbol: "BTC/USDT:USDT"
  timeframe: "4h"
  leverage: 2.0
  taker_fee: 0.0006
  slippage: 0.0005
strategy:
  name: ema_cross
  params:
    fast: 20
    slow: 50
    allow_short: false
